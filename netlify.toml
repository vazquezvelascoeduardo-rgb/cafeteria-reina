[build]
  command = "npm run build"
  publish = "dist"

# El service worker nunca debe quedarse cacheado: es lo que trae las
# actualizaciones al ordenador de la cafetería
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
